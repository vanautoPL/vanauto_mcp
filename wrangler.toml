# Cloudflare Worker deployment for the public VanAuto campers MCP.
#
#   npx wrangler dev      - local HTTP endpoint at http://127.0.0.1:8787/mcp
#   npx wrangler deploy   - deploy to https://vanauto-campers-mcp.<subdomain>.workers.dev/mcp
#
# The custom domain mcp.vanauto.pl is attached in a later step (see README) so
# the first deploy can be verified on workers.dev first.

name = "vanauto-campers-mcp"
main = "src/worker.js"
compatibility_date = "2026-10-01"

# Only the custom domain is public. The workers.dev route would bypass the
# zone-level rate limiting rule for mcp.vanauto.pl, so it stays disabled.
workers_dev = false

# No secrets: the server only calls the public VanAuto API as an anonymous
# visitor. The API URL stays overridable for staging/local targets.
[vars]
VANAUTO_API_URL = "https://api.vanauto.pl"
VANAUTO_SITE_URL = "https://vanauto.pl"

# Public endpoint. Created automatically on deploy while the vanauto.pl zone is
# in this Cloudflare account (TLS certificate is provisioned by Cloudflare).
[[routes]]
pattern = "mcp.vanauto.pl"
custom_domain = true

# Anonymous tool-usage analytics (tool name, sanitized filters, ok/error,
# client family). No IP addresses or identifiers are stored. Schema lives in
# migrations/0001_tool_events.sql. `wrangler dev` writes to a local copy; the
# deployed Worker writes to the real database.
[[d1_databases]]
binding = "USAGE_DB"
database_name = "vanauto-mcp-usage"
database_id = "d59b28af-295b-4756-b942-ac7765e8ffe9"
