name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Verify the deployed endpoint
        run: |
          for attempt in 1 2 3 4 5; do
            if MCP_URL=https://mcp.vanauto.pl/mcp npm run smoke:http; then
              exit 0
            fi
            echo "verification attempt $attempt failed; waiting for edge propagation..."
            sleep 20
          done
          echo "verification failed after 5 attempts" >&2
          exit 1
